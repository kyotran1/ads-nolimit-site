# Build Astro và deploy lên GitHub Pages mỗi khi push vào nhánh main.
# Lưu ý: workflow chỉ chạy được khi chủ repo bật GitHub Pages
# (Settings → Pages → Source: GitHub Actions). Workflow này không tự bật Pages.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
          PUBLIC_FB_LOGIN: test   # off | test | on — xem src/config/auth-providers.ts
          PUBLIC_MESSENGER_NOTIFY: on   # off | test | on — xem src/config/notify-flags.ts

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
