<html lang="vi">

    <meta charset="utf-8" />
    <style>
      @font-face {

        unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;
      }
      @font-face {
        font-family: 'Be Vietnam Pro';
        font-weight: 500;
        src: url('../node_modules/@fontsource/be-vietnam-pro/files/be-vietnam-pro-latin-500-normal.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Be Vietnam Pro';
        font-weight: 800;
        src: url('../node_modules/@fontsource/be-vietnam-pro/files/be-vietnam-pro-vietnamese-800-normal.woff2') format('woff2');
        unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;
      }
      @font-face {
        font-family: 'Be Vietnam Pro';
        font-weight: 800;
        src: url('../node_modules/@fontsource/be-vietnam-pro/files/be-vietnam-pro-latin-800-normal.woff2') format('woff2');
      }
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      body {
        position: relative;
        font-family: 'Be Vietnam Pro', sans-serif;
        color: #edeffb;
        background:
          radial-gradient(60% 90% at 88% 10%, rgb(72 0 168 / 0.55), transparent 65%),
          radial-gradient(40% 60% at 0% 100%, rgb(24 144 144 / 0.22), transparent 70%),
          #070a1a;
      }
      .wrap {
        position: absolute;
        inset: 64px 72px;
        display: flex;
        flex-direction: column;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 16px;
        font-weight: 800;
        font-size: 34px;
        letter-spacing: -0.01em;
      }
      .brand img {
        width: 92px;
      }
      h1 {
        margin: 56px 0 0;
        max-width: 760px;
        font-size: 62px;
        line-height: 1.12;
        letter-spacing: -0.028em;
        font-weight: 800;
      }
      p {
        margin: 22px 0 0;
        max-width: 640px;
        font-size: 28px;
        line-height: 1.45;
        font-weight: 500;
        color: #a9b0d6;
      }
      .foot {
        margin-top: auto;
        display: flex;
        align-items: center;
        gap: 36px;
        font-size: 24px;
        font-weight: 500;
        color: #a9b0d6;
      }
      .foot strong {
        color: #edeffb;
        font-weight: 800;
      }
      .url {
        margin-left: auto;
        color: #2ee89a;
        font-weight: 800;
      }
      svg {
        position: absolute;
        right: 28px;
        top: 175px;
        width: 400px;
        opacity: 0.95;
      }
      .bar {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 8px;
        background: linear-gradient(100deg, #4800a8 0%, #1800f0 34%, #189090 68%, #00d878 100%);
      }
    </style>
  </head>
  <body>
    <svg viewBox="-10 -14 420 230" aria-hidden="true">
      <defs>
        <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#1800f0" />
          <stop offset="0.3" stop-color="#4800a8" />
          <stop offset="0.55" stop-color="#6a2bd8" />
          <stop offset="0.78" stop-color="#189090" />
          <stop offset="1" stop-color="#00d878" />
        </linearGradient>
      </defs>
      <path id="p" d="M200 100 C260 20 380 20 380 100 C380 180 260 180 200 100 C140 20 20 20 20 100 C20 180 140 180 200 100 Z" fill="none" stroke="url(#g)" stroke-width="15" />
      <path d="M200 100 C260 20 380 20 380 100 C380 180 260 180 200 100 C140 20 20 20 20 100 C20 180 140 180 200 100 Z" fill="none" stroke="#00d878" stroke-width="1.6" stroke-opacity="0.55" transform="translate(200 100) scale(1.075 1.16) translate(-200 -100)" />
      <circle cx="312.5" cy="40" r="7" fill="#eed65a" />

    <div class="wrap">
      <div class="brand"><img src="../src/assets/brand/logo-mark.png" alt="" />ADS-Nolimit</div>
      <h1>Quảng cáo &amp; AI Agent<br />cho doanh nghiệp</h1>
      <p>Nhân viên AI làm việc 24/7.<br />Quảng cáo được tối ưu mỗi ngày.</p>
      <div class="foot">
        <span><strong>Từ 2016</strong> làm quảng cáo</span>
        <span><strong>800+</strong> khách hàng</span>
        <span class="url">ads-nolimit.agency</span>
